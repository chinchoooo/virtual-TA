name: hyde
description: HyDE query expansion (question + hypothetical answer), dense retrieval.
chunker: {name: markdown, params: {max_words: 250}}
embedder: {name: openai, params: {model: text-embedding-3-small}}
retriever: {name: dense}
query_transform: {name: hyde, params: {model: gpt-4o-mini, keep_original: true}}
generator: {name: llm, params: {model: gpt-4o-mini}}
