[project]
name = "virtual-ta"
version = "0.2.0"
description = "A research playground for Retrieval-Augmented Generation over the IITM Tools in Data Science course."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "requests>=2.31",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Only needed to rebuild the corpus from raw sources (`vta ingest ...`).
ingest = ["beautifulsoup4>=4.12", "html2text>=2024.2.26"]

[project.scripts]
vta = "virtual_ta.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_ta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # str.split() for word lists is fine
